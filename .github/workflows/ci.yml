name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (includes API contract check)
        run: python -m pytest -q

  docker:
    name: Server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t comb-server:ci server
      - name: Smoke test
        run: |
          docker run -d --name comb -p 8080:8080 comb-server:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs comb
          echo "::error title=Server did not start::health check never answered"
          exit 1
