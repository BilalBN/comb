name: comb
description: "Comb: private notes and tasks, end-to-end encrypted, with a markdown folder for Obsidian."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
