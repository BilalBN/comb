[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comb-server"
version = "0.1.0"
description = "Comb sync server: stores and forwards end-to-end encrypted notes and tasks"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pynacl>=1.5",
]

[tool.setuptools]
packages = ["comb_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
